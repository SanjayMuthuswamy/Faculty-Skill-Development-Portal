[alembic]
script_location = migrations
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/fsdp_db

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

[loggers]
keys = root,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
